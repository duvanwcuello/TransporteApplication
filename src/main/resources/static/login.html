<!DOCTYPE html>

<html lang="es">

<head>

    ```
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>XYZ Transporte - Login</title>

    <link rel="stylesheet"
          href="css/estilos.css">
    ```

</head>

<body>

<div class="contenedor-login">

    ```
    <div class="login">

        <h1>XYZ Transporte</h1>

        <h2>Inicio de sesión</h2>

        <form id="loginForm">

            <label for="username">
                Usuario
            </label>

            <input
                    type="text"
                    id="username"
                    required
            >

            <label for="password">
                Contraseña
            </label>

            <input
                    type="password"
                    id="password"
                    required
            >

            <button type="submit">
                Ingresar
            </button>

        </form>

        <p id="mensaje"></p>

    </div>
    ```

</div>

<script src="js/login.js"></script>

</body>

</html>
