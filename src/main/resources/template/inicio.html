<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.w3.org/1999/xhtml">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopEasy - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            width: 380px;
            padding: 35px;

            background: white;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .mensaje {
            margin-bottom: 20px;
            padding: 10px;

            border-radius: 5px;

            text-align: center;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .logout {
            background: #dcfce7;
            color: #166534;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>ShopEasy</h1>

    <div
            th:if="${param.error}"
            class="mensaje error">

        Usuario o contraseña incorrectos.

    </div>

    <div
            th:if="${param.logout}"
            class="mensaje logout">

        Sesión cerrada correctamente.

    </div>

    <form
            action="/login"
            method="post">

        <div class="campo">

            <label for="username">
                Usuario
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    required>

        </div>

        <div class="campo">

            <label for="password">
                Contraseña
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    required>

        </div>

        <button type="submit">
            Iniciar sesión
        </button>

    </form>

</div>

</body>

</html>
